<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Deals — Aubaines de vols vérifiées</title>
  <meta name="description" content="Aubaines de vols détectées et vérifiées en direct. Prix trouvés vs prix moyens, liens de réservation.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <style>
    :root {
      --bg:          #f5f5f7;
      --card:        #ffffff;
      --card-border: rgba(0,0,0,0.06);
      --text:        #1d1d1f;
      --muted:       #6e6e73;
      --muted-2:     #86868b;
      --accent:      #0071e3;
      --accent-hov:  #0077ed;
      --green:       #1d8a3e;
      --green-bg:    #e8f7ec;
      --amber-bg:    #fff4e5;
      --amber:       #b25f00;
      --radius-lg:   22px;
      --radius-md:   14px;
      --radius-sm:   10px;
      --shadow-card: 0 1px 3px rgba(0,0,0,0.05), 0 8px 24px rgba(0,0,0,0.06);
      --shadow-hover:0 4px 10px rgba(0,0,0,0.06), 0 16px 40px rgba(0,0,0,0.10);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.47;
      letter-spacing: -0.01em;
    }

    /* ---- Header / Hero ---- */
    header {
      background: linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 100%);
      padding: 4.5rem 1.5rem 3.5rem;
      text-align: center;
    }
    header .eyebrow {
      font-size: 0.9rem; font-weight: 600; color: var(--accent);
      letter-spacing: 0.02em; margin-bottom: 0.6rem;
    }
    header h1 {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 700; letter-spacing: -0.03em; color: var(--text);
      line-height: 1.05;
    }
    header .subtitle {
      color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem);
      margin-top: 0.9rem; font-weight: 400; max-width: 640px;
      margin-left: auto; margin-right: auto;
    }
    header .meta {
      display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap;
      margin-top: 2.25rem; font-size: 0.88rem; color: var(--muted-2);
    }
    header .meta b { color: var(--text); font-weight: 600; }

    /* ---- Layout ---- */
    main { max-width: 1180px; margin: 0 auto; padding: 0 1.5rem 5rem; }

    /* ---- Stats strip ---- */
    .stats-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
      gap: 1px; background: var(--card-border);
      border-radius: var(--radius-md); overflow: hidden;
      margin: 0 0 3rem; box-shadow: var(--shadow-card);
    }
    .stat-box {
      background: var(--card); padding: 1.6rem 1.4rem; text-align: center;
    }
    .stat-box .num { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .stat-box .lbl { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; font-weight: 500; }

    .section-title {
      font-size: 1.55rem; font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 1.6rem; color: var(--text);
      display: flex; align-items: center; gap: 0.7rem;
    }
    .section-title .count {
      background: var(--text); color: #fff; border-radius: 99px;
      padding: 3px 13px; font-size: 0.78rem; font-weight: 600;
    }

    /* ---- Deal Card ---- */
    .deals-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.75rem;
    }
    .deal-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card);
      transition: transform 0.35s cubic-bezier(.2,.9,.2,1), box-shadow 0.35s cubic-bezier(.2,.9,.2,1);
      display: flex; flex-direction: column;
    }
    .deal-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

    /* Image */
    .deal-img {
      position: relative; height: 240px; overflow: hidden;
      background: linear-gradient(135deg,#e5e5ea,#d1d1d6);
    }
    .deal-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.6s cubic-bezier(.2,.9,.2,1);
    }
    .deal-card:hover .deal-img img { transform: scale(1.06); }
    .deal-img .badge-top {
      position: absolute; top: 14px; left: 14px;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px) saturate(1.6);
      color: var(--text);
      border-radius: 99px; padding: 6px 14px; font-size: 0.76rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .deal-img .badge-top.verified { color: var(--green); }
    .deal-img .badge-top.warn { color: var(--amber); }
    .deal-img .city-name {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.65) 60%, rgba(0,0,0,0.75));
      padding: 2.2rem 1.3rem 1rem; color: #fff;
      font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em;
    }
    .deal-img .city-name small {
      display: block; font-size: 0.78rem; font-weight: 500;
      color: rgba(255,255,255,0.78); margin-top: 2px; letter-spacing: 0;
    }

    /* Body */
    .deal-body { padding: 1.4rem 1.5rem 1.6rem; flex: 1; display: flex; flex-direction: column; }

    /* Price block */
    .price-row { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.35rem; }
    .price-now { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
    .price-was { font-size: 1.05rem; color: var(--muted-2); text-decoration: line-through; }
    .price-save {
      background: var(--green-bg); color: var(--green);
      border-radius: 99px; padding: 3px 11px; font-size: 0.82rem; font-weight: 700;
    }
    .verified-note {
      color: var(--green); font-size: 0.8rem; font-weight: 500; margin-bottom: 0.9rem;
      display: flex; align-items: center; gap: 5px;
    }

    /* Bar comparison */
    .bar-wrap { margin: 0.9rem 0 1.1rem; }
    .bar-label { font-size: 0.76rem; color: var(--muted); display: flex; justify-content: space-between; }
    .bar-track {
      height: 6px; background: #e5e5ea; border-radius: 99px; margin-top: 6px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--green), #34c759);
      transition: width 0.8s cubic-bezier(.2,.9,.2,1);
    }

    /* Meta grid */
    .meta-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem; margin: 0.3rem 0 1.1rem;
    }
    .meta-item {
      background: var(--bg); border-radius: var(--radius-sm); padding: 0.65rem 0.85rem;
    }
    .meta-item .label { font-size: 0.68rem; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
    .meta-item .value { font-size: 0.92rem; font-weight: 600; margin-top: 2px; color: var(--text); }

    /* Sources */
    .sources { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
    .source-tag {
      background: var(--bg); border-radius: 6px; padding: 3px 9px;
      font-size: 0.7rem; color: var(--muted); font-weight: 500;
    }
    .source-tag.verified { background: var(--green-bg); color: var(--green); }

    /* CTA button */
    .cta {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-top: auto;
      background: var(--accent); color: #fff;
      padding: 0.85rem 1.5rem; border-radius: 99px;
      font-weight: 600; font-size: 0.95rem; text-decoration: none;
      transition: background 0.2s;
    }
    .cta:hover { background: var(--accent-hov); }

    /* Footer */
    footer {
      text-align: center; padding: 3rem 1.5rem; color: var(--muted-2); font-size: 0.82rem;
      border-top: 1px solid var(--card-border); margin-top: 2rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .empty-state {
      text-align: center; padding: 5rem 2rem; color: var(--muted);
      background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--card-border);
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>

<header>
  <div class="eyebrow">Détection automatisée · Vérifié en direct</div>
  <h1>Flight Deals</h1>
  <p class="subtitle">Les meilleures aubaines de vols, détectées par algorithme et confirmées en temps réel avant d'être affichées.</p>
  <div class="meta" id="meta"></div>
</header>

<main>
  <div class="stats-bar" id="stats-bar"></div>
  <div class="section-title">
    <span id="section-label">Aubaines actives</span>
    <span class="count" id="deal-count">0</span>
  </div>
  <div class="deals-grid" id="deals"></div>
</main>

<footer>
  Données fournies par <a href="#">flightdeals pipeline</a> · Mise à jour à chaque scan ·
  <span id="footer-time"></span>
</footer>

<script>
// ======================== CONFIG ========================
// Photos réelles vérifiées (Wikimedia Commons, licence libre) par destination.
const ROUTE_META = {
  'YUL-CDG': { city: 'Paris',        country: 'France',          emoji: '🇫🇷', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/La_Tour_Eiffel_vue_de_la_Tour_Saint-Jacques%2C_Paris_ao%C3%BBt_2014_%282%29.jpg/960px-La_Tour_Eiffel_vue_de_la_Tour_Saint-Jacques%2C_Paris_ao%C3%BBt_2014_%282%29.jpg' },
  'YUL-NRT': { city: 'Tokyo',        country: 'Japon',            emoji: '🇯🇵', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/Skyscrapers_of_Shinjuku_2009_January.jpg/960px-Skyscrapers_of_Shinjuku_2009_January.jpg' },
  'YUL-LIS': { city: 'Lisbonne',     country: 'Portugal',         emoji: '🇵🇹', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Lisboa_-_Portugal_%2852597836992%29.jpg/960px-Lisboa_-_Portugal_%2852597836992%29.jpg' },
  'YUL-BCN': { city: 'Barcelone',    country: 'Espagne',          emoji: '🇪🇸', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Evening_light_over_Barcelona.jpg/960px-Evening_light_over_Barcelona.jpg' },
  'YUL-CUN': { city: 'Cancún',       country: 'Mexique',          emoji: '🇲🇽', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Cancun_Strand_Luftbild_%2822143397586%29.jpg/960px-Cancun_Strand_Luftbild_%2822143397586%29.jpg' },
  'YUL-LHR': { city: 'Londres',      country: 'Royaume-Uni',      emoji: '🇬🇧', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/London_Skyline_%28125508655%29.jpeg/960px-London_Skyline_%28125508655%29.jpeg' },
  'YUL-FCO': { city: 'Rome',         country: 'Italie',           emoji: '🇮🇹', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Trevi_Fountain%2C_Rome%2C_Italy_2_-_May_2007.jpg/960px-Trevi_Fountain%2C_Rome%2C_Italy_2_-_May_2007.jpg' },
  'YUL-MEX': { city: 'Mexico',       country: 'Mexique',          emoji: '🇲🇽', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Sobrevuelos_CDMX_HJ2A4913_%2825514321687%29_%28cropped%29.jpg/960px-Sobrevuelos_CDMX_HJ2A4913_%2825514321687%29_%28cropped%29.jpg' },
  'YUL-LAX': { city: 'Los Angeles',  country: 'États-Unis',       emoji: '🇺🇸', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2f/Hollywood_sign_%288485145044%29.jpg/960px-Hollywood_sign_%288485145044%29.jpg' },
  'YUL-MIA': { city: 'Miami',        country: 'États-Unis',       emoji: '🇺🇸', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Villa_Vizcaya_20110228.jpg/960px-Villa_Vizcaya_20110228.jpg' },
  'YUL-DXB': { city: 'Dubaï',        country: 'Émirats arabes',   emoji: '🇦🇪', image: 'https://thumb.wikimedia.org/wikipedia/en/thumb/c/c7/Burj_Khalifa_2021.jpg/960px-Burj_Khalifa_2021.jpg' },
  'YUL-BKK': { city: 'Bangkok',      country: 'Thaïlande',        emoji: '🇹🇭', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/4Y1A1159_Bangkok_%2833536795515%29.jpg/960px-4Y1A1159_Bangkok_%2833536795515%29.jpg' },
  'YUL-MAD': { city: 'Madrid',       country: 'Espagne',          emoji: '🇪🇸', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Madrid_-_Sky_Bar_360%C2%BA_%28Hotel_Riu_Plaza_Espa%C3%B1a%29%2C_vistas_19.jpg/960px-Madrid_-_Sky_Bar_360%C2%BA_%28Hotel_Riu_Plaza_Espa%C3%B1a%29%2C_vistas_19.jpg' },
  'YUL-ATH': { city: 'Athènes',      country: 'Grèce',            emoji: '🇬🇷', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Athens_Acropolis_at_Daybreak.jpg/960px-Athens_Acropolis_at_Daybreak.jpg' },
  'YUL-PUJ': { city: 'Punta Cana',   country: 'Rép. dominicaine', emoji: '🇩🇴', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Cap_Cana_Marina_Dominican_Republic.jpg/960px-Cap_Cana_Marina_Dominican_Republic.jpg' },
};
const AIRLINE_NAMES = {
  AC: 'Air Canada', AF: 'Air France', LH: 'Lufthansa',
  TS: 'Air Transat', DL: 'Delta', UA: 'United', WS: 'WestJet', BA: 'British Airways',
};
// fallback générique si une route n'est pas dans la table (pas de photo random —
// on utilise un dégradé neutre plutôt qu'une image non pertinente).
function routeMeta(route) {
  if (ROUTE_META[route]) return ROUTE_META[route];
  const dest = route.split('-')[1] || route;
  return { city: dest, country: '', emoji: '🌍', image: null };
}

// ======================== RENDER ========================
function fmtPrice(n) {
  return Math.round(n).toLocaleString('fr-CA') + ' $';
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('fr-CA', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderMeta(scan) {
  const el = document.getElementById('meta');
  const providers = scan.providers.join(' + ');
  el.innerHTML = `
    <span>Sources <b>${providers}</b></span>
    <span>Routes <b>${scan.routes_scanned}</b></span>
    <span>Prix relevés <b>${scan.quotes_seen}</b></span>
    <span>Dernier scan <b>${fmtDate(scan.finished_at.split('T')[0])}</b></span>
  `;
}

function renderStats(scan) {
  const el = document.getElementById('stats-bar');
  const savings = scan.deals.reduce((sum, d) => sum + (d.baseline - d.price), 0);
  const verifiedCount = scan.deals.filter(d => d.verified).length;
  el.innerHTML = `
    <div class="stat-box"><div class="num">${scan.deals.length}</div><div class="lbl">Aubaines détectées</div></div>
    <div class="stat-box"><div class="num" style="color:var(--green)">${verifiedCount}</div><div class="lbl">Vérifiées en direct</div></div>
    <div class="stat-box"><div class="num">${fmtPrice(savings)}</div><div class="lbl">Économies potentielles</div></div>
    <div class="stat-box"><div class="num">${scan.deals.length > 0 ? Math.round(scan.deals.reduce((s,d)=>s+d.drop_pct,0)/scan.deals.length*100) : 0}%</div><div class="lbl">Baisse moyenne</div></div>
  `;
}

function renderDeal(deal) {
  const meta = routeMeta(deal.route);
  const airlineName = AIRLINE_NAMES[deal.airline] || deal.airline || '—';
  const dropPct = Math.round(deal.drop_pct * 100);
  const savings = deal.baseline - deal.price;
  const barWidth = Math.min(100, (deal.price / deal.baseline) * 100);

  let topBadge;
  if (deal.verified) {
    topBadge = `<div class="badge-top verified">✓ Vérifié en direct</div>`;
  } else if (deal.confirmed) {
    topBadge = `<div class="badge-top verified">✓ Confirmé · ${deal.confirmations} sources</div>`;
  } else {
    topBadge = `<div class="badge-top warn">À confirmer avant achat</div>`;
  }

  const imgBlock = meta.image
    ? `<img src="${meta.image}" alt="${meta.city}" loading="lazy">`
    : '';

  return `
  <div class="deal-card">
    <div class="deal-img">
      ${imgBlock}
      ${topBadge}
      <div class="city-name">${meta.emoji} ${meta.city}<small>${deal.route} · ${meta.country}</small></div>
    </div>
    <div class="deal-body">
      <div class="price-row">
        <span class="price-now">${fmtPrice(deal.price)}</span>
        <span class="price-was">${fmtPrice(deal.baseline)}</span>
        <span class="price-save">−${dropPct}%</span>
      </div>
      ${deal.verified ? '<div class="verified-note">✓ Prix confirmé par recherche en direct au moment du scan</div>' : ''}

      <div class="bar-wrap">
        <div class="bar-label">
          <span>Prix trouvé</span>
          <span>Moyenne : ${fmtPrice(deal.baseline)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${barWidth}%"></div>
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-item">
          <div class="label">Aller</div>
          <div class="value">${fmtDate(deal.depart_date)}</div>
        </div>
        <div class="meta-item">
          <div class="label">Retour</div>
          <div class="value">${fmtDate(deal.return_date)}</div>
        </div>
        <div class="meta-item">
          <div class="label">Compagnie</div>
          <div class="value">${airlineName}</div>
        </div>
        <div class="meta-item">
          <div class="label">Économie</div>
          <div class="value" style="color:var(--green)">${fmtPrice(savings)}</div>
        </div>
      </div>

      <div class="sources">
        ${deal.sources.map(s => `<span class="source-tag">${s}</span>`).join('')}
        ${deal.verified ? '<span class="source-tag verified">serpapi · vérif</span>' : ''}
      </div>

      <a href="${deal.deep_link}" target="_blank" rel="noopener" class="cta">
        Réserver ce vol
      </a>
    </div>
  </div>
  `;
}

function render(scan) {
  document.getElementById('deal-count').textContent = scan.deals.length;
  document.getElementById('footer-time').textContent =
    'Dernier scan : ' + scan.finished_at;

  if (scan.is_top_deals) {
    document.getElementById('section-label').textContent = "Meilleurs prix trouvés";
  }

  renderMeta(scan);
  renderStats(scan);

  const container = document.getElementById('deals');
  if (scan.deals.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="emoji">🛫</div>
        <p>Aucune aubaine détectée lors du dernier scan.<br>Revenez plus tard !</p>
      </div>`;
    return;
  }
  const sorted = [...scan.deals].sort((a, b) => {
    if (a.verified !== b.verified) return b.verified - a.verified;
    if (a.confirmed !== b.confirmed) return b.confirmed - a.confirmed;
    return b.drop_pct - a.drop_pct;
  });
  container.innerHTML = sorted.map(renderDeal).join('');
}

// ======================== LOAD ========================
async function loadScan() {
  if (window.__SCAN_DATA__) return window.__SCAN_DATA__;
  const resp = await fetch('data/latest-scan.json');
  return await resp.json();
}

loadScan().then(scan => {
  render(scan);
}).catch(err => {
  document.getElementById('deals').innerHTML =
    '<div class="empty-state" style="grid-column:1/-1;color:#c0392b">Erreur de chargement des données : ' + err.message + '</div>';
});
</script>

</body>
</html>
